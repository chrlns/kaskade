<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaskade documentation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           font-size: 16px; line-height: 1.65; color: #1f2328; background: #fbfbfc;
           margin: 0 auto; max-width: 52rem; padding: 1rem 1.5rem 3rem; }
    header.site { border-bottom: 1px solid #e3e3e6; margin-bottom: 2rem; padding: 1rem 0;
                  display: flex; gap: 1.25rem; align-items: baseline; }
    header.site .brand { font-weight: 700; color: #0b62c4; font-size: 1.2rem; }
    header.site a { color: #444; text-decoration: none; }
    header.site a:hover { color: #0b62c4; }
    h1 { font-size: 1.9rem; margin-top: 1.25rem; }
    h2 { border-bottom: 1px solid #e3e3e6; padding-bottom: .3rem; margin-top: 2.5rem; }
    h3 { margin-top: 2rem; }
    a { color: #0b62c4; }
    code { background: #f0f1f3; border: 1px solid #e3e3e6; border-radius: 4px;
           padding: .1em .35em; font-size: .9em;
           font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre { background: #f6f7f9; border: 1px solid #e3e3e6; border-radius: 8px;
          padding: 1rem; overflow-x: auto; }
    pre code { background: none; border: none; padding: 0; font-size: .85em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e3e3e6; padding: .45rem .7rem; text-align: left; }
    th { background: #f0f1f3; }
    blockquote { border-left: 4px solid #0b62c4; margin: 1rem 0; padding: .2rem 1rem;
                 color: #555; background: #f6f7f9; }
    footer.site { border-top: 1px solid #e3e3e6; margin-top: 3rem; padding-top: 1rem;
                  color: #888; font-size: .85rem; }
  </style>
</head>
<body>
<header class="site">
  <span class="brand">Kaskade</span>
  <a href="index.html">Overview</a>
  <a href="getting-started.html">Getting started</a>
  <a href="scenarios.html">Scenarios</a>
</header>
